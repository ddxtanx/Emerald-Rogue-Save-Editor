name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # eframe/glow need these X11 headers to link on Linux
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxkbcommon-x11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Format check
        run: cargo fmt --check
      # Zero-warning bar, enforced in CI: the crate reached 140 clippy warnings
      # (rustdoc list lints, index loops, dead casts) before a cleanup pass, and a
      # local-only bar is how they accumulated. Runs before the release build so a
      # lint failure reports in seconds, not after a full optimised build.
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
